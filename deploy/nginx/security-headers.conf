# Заголовки безопасности. Подключаются через include в КАЖДЫЙ location.
#
# Почему не один раз в блоке server: в nginx директивы add_header из вложенного
# location полностью заменяют унаследованные из server, а не дополняют их.
# Поскольку в каждом location у нас есть свой Cache-Control, объявление
# заголовков только на уровне server привело бы к тому, что HSTS,
# X-Frame-Options и остальные не отправлялись бы вообще — молча, без ошибок.
#
# Устанавливается в /etc/nginx/snippets/infofield-security.conf

# Год ходить на домен только по https. Включать, когда HTTPS уже работает.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Запрет угадывания типа содержимого.
add_header X-Content-Type-Options "nosniff" always;
# Запрет встраивания сайта в iframe (защита от кликджекинга).
add_header X-Frame-Options "DENY" always;
# Не раскрывать адреса дашборда внешним сайтам.
add_header Referrer-Policy "no-referrer" always;
# Отключить ненужные возможности браузера.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Изолировать окно от других источников.
add_header Cross-Origin-Opener-Policy "same-origin" always;
