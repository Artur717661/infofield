# nginx для info-field.ru
#
# Установка:
#   sudo cp deploy/nginx/info-field.ru.conf /etc/nginx/sites-available/info-field.ru
#   sudo ln -s /etc/nginx/sites-available/info-field.ru /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Строки с ssl_* добавит certbot автоматически при выпуске сертификата.

# Ограничение частоты запросов к входу: 5 попыток в минуту с одного IP.
# Это дополнение к блокировке в самом шлюзе, а не замена ей.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# Общий лимит на API, чтобы никто не выкачивал данные в цикле.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

# HTTP -> HTTPS. Единственное, что отдаётся по http, — проверка certbot.
server {
    listen 80;
    listen [::]:80;
    server_name info-field.ru www.info-field.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://info-field.ru$request_uri;
    }
}

# www -> без www, чтобы куки сессии жили на одном домене.
server {
    # Форма 'listen ... http2' понимается и nginx 1.18/1.24 (Ubuntu 22.04/24.04),
    # и новыми версиями. Директива 'http2 on;' появилась только в nginx 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.info-field.ru;

    ssl_certificate     /etc/letsencrypt/live/info-field.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/info-field.ru/privkey.pem;

    return 301 https://info-field.ru$request_uri;
}

server {
    # Форма 'listen ... http2' понимается и nginx 1.18/1.24 (Ubuntu 22.04/24.04),
    # и новыми версиями. Директива 'http2 on;' появилась только в nginx 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name info-field.ru;

    ssl_certificate     /etc/letsencrypt/live/info-field.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/info-field.ru/privkey.pem;

    # Только современные протоколы; TLS 1.0/1.1 и SSLv3 отключены.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Заголовки безопасности подключаются include'ом в каждый location ниже:
    # add_header в location заменяет унаследованные из server, а не дополняет,
    # поэтому объявить их здесь один раз недостаточно.
    # Убираем версию nginx из ответов.
    server_tokens off;

    # Логи: отдельные файлы, чтобы удобно смотреть попытки входа.
    access_log /var/log/nginx/info-field.access.log;
    error_log  /var/log/nginx/info-field.error.log warn;

    # Ограничение размера тела запроса: дашборд только читает данные,
    # большие POST'ы ему не нужны.
    client_max_body_size 64k;

    # --- вход: жёсткий лимит частоты ---
    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        # Шлюз ставит эти заголовки сам, чтобы быть безопасным и без nginx.
        # Прячем его версии, иначе клиент получит каждый заголовок дважды.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/snippets/infofield-security.conf;
    }

    # --- остальное API ---
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;

        # Первый запрос данных запускает парсер и Gemini — это долго.
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
        # Ответы с данными не кэшируем нигде.
        # Шлюз ставит эти заголовки сам, чтобы быть безопасным и без nginx.
        # Прячем его версии, иначе клиент получит каждый заголовок дважды.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_buffering off;
        include /etc/nginx/snippets/infofield-security.conf;
        add_header Cache-Control "no-store" always;
    }

    # --- собранный фронтенд ---
    # Файлы с хэшем в имени можно кэшировать надолго.
    location /assets/ {
        alias /opt/infofield/frontend/dist/assets/;
        access_log off;
        expires 1y;
        include /etc/nginx/snippets/infofield-security.conf;
        add_header Cache-Control "public, immutable";
    }

    # index.html не кэшируем, иначе после деплоя пользователи увидят старую
    # версию, которая тянет уже удалённые файлы assets.
    location / {
        root /opt/infofield/frontend/dist;
        try_files $uri /index.html;
        include /etc/nginx/snippets/infofield-security.conf;
        add_header Cache-Control "no-cache" always;
    }
}
