# Настройки PostgreSQL для сервера с 1 ГБ RAM.
#
# Установка:
#   sudo cp deploy/systemd/lowmem/postgresql-lowmem.conf \
#           /etc/postgresql/16/main/conf.d/lowmem.conf
#   sudo systemctl restart postgresql
#
# (при другой версии Postgres поменяйте 16 на свою: ls /etc/postgresql)
#
# По умолчанию Postgres рассчитан на сервер побольше. Наша база крошечная
# (~9 МБ на 1500 публикаций) и запросов к ней мало — весь объём спокойно
# помещается в уменьшенные буферы, а освободившиеся ~60 МБ достаются Chromium.

# Кэш страниц: по умолчанию 128 МБ, нам столько не нужно.
shared_buffers = 64MB

# Подключений нужно немного: backend + шлюз + запас.
max_connections = 20

# Память на сортировку одного запроса.
work_mem = 4MB
maintenance_work_mem = 32MB

# Подсказка планировщику, сколько всего памяти под кэш ОС.
effective_cache_size = 256MB

# Меньше параллельных процессов — на одном ядре они всё равно не помогают.
max_worker_processes = 2
max_parallel_workers = 1
max_parallel_workers_per_gather = 0
