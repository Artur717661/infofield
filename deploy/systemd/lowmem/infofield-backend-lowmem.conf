# Ограничение памяти для backend на сервере с 1 ГБ RAM.
#
# Установка:
#   sudo mkdir -p /etc/systemd/system/infofield-backend.service.d
#   sudo cp deploy/systemd/lowmem/infofield-backend-lowmem.conf \
#           /etc/systemd/system/infofield-backend.service.d/lowmem.conf
#   sudo systemctl daemon-reload && sudo systemctl restart infofield-backend
#
# Зачем: парсер запускает Chromium, который на пике съедает ~300 МБ. Без
# ограничения при нехватке памяти ядро выбирает жертву само и может убить
# PostgreSQL или шлюз — тогда упадёт весь сайт. С этим лимитом OOM происходит
# внутри cgroup backend'а: умирает только парсер, сайт продолжает отдавать
# данные из кэша шлюза. systemd поднимет backend через 5 секунд.

[Service]
MemoryMax=520M
MemoryHigh=440M

# Парсер на одном ядре не должен забирать весь процессор у nginx и шлюза.
CPUWeight=50
